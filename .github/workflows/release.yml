name: Release
run-name: ${{ github.event_name == 'push' && 'Automatic stable release' || 'Manual stable release' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Initial release: 8.3.6; otherwise optional stable override without v'
        required: false
        type: string
      migration_notes:
        description: 'Required for initial release; use "No manual steps required" if applicable'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

# One active publisher and the newest pending run. Resolve main only AFTER
# entering this queue, so dropped/intermediate events cannot lose changes.
concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # GitHub exposes draft release journals only to repository push readers.
      contents: write
      pull-requests: read
      packages: read
    outputs:
      eligible: ${{ steps.plan.outputs.eligible }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      image: ${{ steps.plan.outputs.image }}
      reconcile: ${{ steps.plan.outputs.reconcile }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Pin the main commit selected inside the publication queue
        run: echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Calculate the version and collect reviewed upgrade notes
        id: plan
        run: python -m scripts.release_publication plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLAN: ${{ runner.temp }}/release-plan.json
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_NOTES: ${{ inputs.migration_notes }}
      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.eligible == 'true'
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan.json
          retention-days: 7

  validate:
    name: Release validation
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    with:
      commit: ${{ needs.prepare.outputs.commit }}

  publish:
    needs: [prepare, validate]
    if: needs.prepare.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          name: release-plan
          path: ${{ runner.temp }}
      - name: Revalidate the publication plan or recover its original image
        id: stage
        run: python -m scripts.release_publication stage
        env:
          RELEASE_PLAN: ${{ runner.temp }}/release-plan.json
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build the exact version without publishing
        id: build
        if: steps.stage.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/release-image.tar
          tags: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the exact image that will be published
        if: steps.stage.outputs.build == 'true'
        uses: ./.github/actions/container-scan
        with:
          archive: ${{ runner.temp }}/release-image.tar
          reports: ${{ runner.temp }}/container-security
      - name: Scan the original immutable image during recovery
        if: steps.stage.outputs.build != 'true'
        uses: ./.github/actions/container-scan
        with:
          image: ${{ needs.prepare.outputs.image }}@${{ steps.stage.outputs.digest }}
          reports: ${{ runner.temp }}/container-security
      - name: Publish the scanned archive without rebuilding or changing its digest
        if: steps.stage.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          python scripts/container_security.py verify-archive \
            --archive "$RUNNER_TEMP/release-image.tar" \
            --identity-file "$RUNNER_TEMP/container-security/identity.txt"
          skopeo copy --all --preserve-digests \
            --authfile "${DOCKER_CONFIG:-$HOME/.docker}/config.json" \
            "oci-archive:$RUNNER_TEMP/release-image.tar" "docker://$IMAGE_REFERENCE"
        env:
          IMAGE_REFERENCE: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}
      - name: Complete release and verify all three image aliases
        run: python -m scripts.release_publication finish
        env:
          RELEASE_PLAN: ${{ runner.temp }}/release-plan.json
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest || steps.stage.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
      - name: Retain vulnerability diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-security-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/container-security/
          retention-days: 7
          if-no-files-found: ignore

  reconcile:
    name: Verify current stable aliases
    needs: [prepare, validate]
    if: needs.prepare.outputs.reconcile == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Resolve the verified immutable stable image before changing aliases
        id: image
        run: python -m scripts.release_publication security-target
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_PLAN: ${{ runner.temp }}/unused-plan.json
          GH_TOKEN: ${{ github.token }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Scan the stable image before reconciling aliases
        uses: ./.github/actions/container-scan
        with:
          image: ${{ steps.image.outputs.image }}
          reports: ${{ runner.temp }}/container-security
      - name: Reuse the current stable image without building or versioning
        run: python -m scripts.release_publication reconcile
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_PLAN: ${{ runner.temp }}/unused-plan.json
          GH_TOKEN: ${{ github.token }}
          SCANNED_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
      - name: Retain vulnerability diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-security-reconcile-${{ github.run_attempt }}
          path: ${{ runner.temp }}/container-security/
          retention-days: 7
          if-no-files-found: ignore

  advance:
    name: Queue changes left after publication or recovery
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m scripts.release_publication advance
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_PLAN: ${{ runner.temp }}/unused-plan.json
          GH_TOKEN: ${{ github.token }}
